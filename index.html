<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-lightmode.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon-darkmode.svg" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Hues</title>
    <link href="/src/input.css" rel="stylesheet">
  </head>
  <body class="bg-space">

    <div class="w-screen h-16 flex">
      <div class="flex grow border-4 border-r-0 border-anti-space rounded-l-full m-2 mr-0 pl-4 items-center">
        <div class="text-anti-space font-bold text-lg">Happy Hues</div>
      </div>
    </div>

    <div id="source-code-link" class="w-screen h-16 flex">
      <div class="flex grow border-4 border-l-0 border-anti-space rounded-r-full m-2 ml-0 pl-2">
        <div class="flex text-sm text-anti-space items-center justify-center">
          <img class="h-3/7 pr-1" src="/link.svg">
          <a href="https://github.com/Samuel-Risner/happy-hues" target="_blank">View source code on GitHub</a>
        </div>
      </div>
    </div>

    <div hidden id="game-tools-wrapper" class="w-screen h-16 flex">
      <div class="flex grow border-4 border-l-0 border-anti-space rounded-r-full m-2 ml-0 pl-2">
        <div id="game-tools-menu" class="flex grow flex-row gap-2 text-sm text-anti-space items-center justify-center mr-4">
        </div>
      </div>
    </div>

    <div id="app" class="flex grow overflow-scroll "></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
